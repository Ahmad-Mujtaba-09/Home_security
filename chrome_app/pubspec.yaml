name: flutter_surveillance
description: Dual-module surveillance app for Child Safety and Elderly Care.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  camera: ^0.11.0
  web_socket_channel: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4
  http: ^1.2.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
